<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <style>    
    </style>
</head>

<body>
    <div class="cursor-dot"></div>
    <div class="cursor-glass"></div>
      <header class="header-nav">
        <a href="index.html" class="nav-link">← Retour à l'accueil</a>
    </header>
<section class="contact-section">
    <h1 class="title-gradient FS-1">Contact</h1>

    <div class="contact-container">
        
        <div class="contact-info">
            <h2 class="L-space">Mes Coordonnées</h2>
            <p class="text-muted">N'hésitez pas à me contacter directement ou à utiliser le formulaire.</p>
            
            <div class="info-item">
                <span class="info-icon">✉</span>
                <div class="info-text">
                    <span class="info-label">Email</span>
                    <a href="mailto:khiallina0110@gmail.com" class="info-link">khiallina0110@gmail.com</a>
                </div>
            </div>

            <div class="info-item">
                <span class="info-icon">📞</span>
                <div class="info-text">
                    <span class="info-label">Téléphone</span>
                    <a href="tel:+33600000000" class="info-link">06 56 72 82 20</a>
                </div>
            </div>

            <div class="info-item">
                <span class="info-icon">📍</span>
                <div class="info-text">
                    <span class="info-label">Ville</span>
                    <span class="info-value">Dourges, France</span>
                </div>
            </div>
        </div>

        <form action="https://formspree.io/f/VOTRE_IDENTIFIANT" method="POST" class="contact-form">
            <div class="form-group">
                <label for="name">Nom</label>
                <input type="text" id="name" name="name" required placeholder="Votre nom">
            </div>

            <div class="form-group">
                <label for="email">Adresse Email</label>
                <input type="email" id="email" name="email" required placeholder="nom@exemple.com">
            </div>

            <div class="form-group">
                <label for="subject">Objet</label>
                <input type="text" id="subject" name="subject" required placeholder="Le motif de votre message">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required placeholder="Votre message ici..."></textarea>
            </div>

            <button type="submit" class="custom-btn btn-submit">Envoyer</button>
        </form>

    </div>
</section>
<script src="script.js"></script>
</body>
</html>
