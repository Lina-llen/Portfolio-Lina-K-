<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Lina Khial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="title-gradient">PORTFOLIO</h1>
  <div class="subtitle">Lina Khial</div>

  <div class="d-flex justify-content-center gap-4 mt-4">
    <a href="apropos.html"><button class="custom-btn">À propos</button></a>
    <a href="contact.html"><button class="custom-btn">Contact</button></a>
  </div>

  <h2 class="section-title">Mes projets</h2>

  <div id="carouselExample" class="carousel slide" data-bs-ride="false">
    <div class="carousel-inner justify-content-center">

      <div class="carousel-item">
        <div class="carousel-card mx-auto">
          <img src="img1.jpg" class="card-img-top" alt="Projet 1">
          <div class="card-bottom">Projet 1</div>
        </div>
      </div>

      <div class="carousel-item">
        <div class="carousel-card mx-auto">
          <img src="img2.jpg" class="card-img-top" alt="Projet 2">
          <div class="card-bottom">Projet 2</div>
        </div>
      </div>

      <div class="carousel-item">
        <div class="carousel-card mx-auto">
          <img src="img3.jpg" class="card-img-top" alt="Projet 3">
          <div class="card-bottom">Projet 3</div>
        </div>
      </div>

    </div>

    <button class="carousel-control-prev custom-btn nav-btn" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next custom-btn nav-btn" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
