<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illustrations Personnelles - Lina Khial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cursor-dot"></div>
    <div class="cursor-glass"></div>

    <header class="header-nav">
        <a href="index.html" class="nav-link">← Retour à l'accueil</a>
    </header>

    <section class="intro-section">
        <h1 class="title-gradient">Mes Illustrations</h1>
        <p class="FS-5 L-space">
            Bienvenue dans mon univers créatif. Vous trouverez ici une sélection de mes illustrations personnelles. 
        </p>
    </section>

    <main class="gallery-grid">
        <div class="gallery-item"><img src="Illustrations/1.png" alt="Illustration 1"></div>
        <div class="gallery-item"><img src="Illustrations/2.png" alt="Illustration 2"></div>
        <div class="gallery-item"><img src="Illustrations/3.png" alt="Illustration 3"></div>
        <div class="gallery-item"><img src="Illustrations/4.png" alt="Illustration 4"></div>
        <div class="gallery-item"><img src="Illustrations/5.png" alt="Illustration 5"></div>
        <div class="gallery-item"><img src="Illustrations/6.png" alt="Illustration 6"></div>
        <div class="gallery-item"><img src="Illustrations/7.png" alt="Illustration 7"></div>
        <div class="gallery-item"><img src="Illustrations/8.png" alt="Illustration 8"></div>
        <div class="gallery-item"><img src="Illustrations/9.png" alt="Illustration 9"></div>
    </main>

    <!-- VIEWER PLEIN ÉCRAN -->
   <div id="illustration-viewer">
    <button class="close-illustration">Fermer ×</button>
    <img id="illustration-viewer-img" src="" alt="Illustration plein écran">
</div>
    <!-- Un seul et unique script appelé -->
    <script src="script.js"></script>
</body>
</html>
